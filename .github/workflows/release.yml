name: Release

# When the plugin version changes on main, tag it and write its release. The
# plugins carry the version of @nodrail/client, whose hook they ship.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the tag and release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release the version if it is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./plugins/claude-code/.claude-plugin/plugin.json").version')
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released."
          else
            # What changed is the client's changelog for this version.
            changelog=https://github.com/Nodrail/nodrail-js/blob/main/packages/client/CHANGELOG.md
            changes=$(curl -fsSL https://raw.githubusercontent.com/Nodrail/nodrail-js/main/packages/client/CHANGELOG.md \
              | awk -v heading="## $version" '$0 == heading { on = 1; next } /^## / { on = 0 } on')
            {
              echo "Ships the hook from [@nodrail/client $version](https://www.npmjs.com/package/@nodrail/client/v/$version)."
              echo
              if [ -n "$changes" ]; then echo "## What changed"; echo "$changes"; echo; fi
              echo "Full history and upgrade notes: [client changelog]($changelog)."
            } > "$RUNNER_TEMP/notes.md"
            gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" \
              --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
          fi
