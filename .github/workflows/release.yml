name: Release

# When the plugin version changes on main, tag it and write its release.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the tag and release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release the version if it is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./plugins/claude-code/.claude-plugin/plugin.json").version')
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released."
          else
            gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --generate-notes
          fi
