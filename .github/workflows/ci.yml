name: Check plugins

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check plugins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Manifests agree and the hook blocks when unconfigured
        run: node scripts/check.mjs
      - name: Claude Code accepts the marketplace and the plugin
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.322 plugin validate --strict .
          npx --yes @anthropic-ai/claude-code@2.1.322 plugin validate --strict plugins/claude-code
